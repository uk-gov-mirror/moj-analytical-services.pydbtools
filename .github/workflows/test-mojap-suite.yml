name: test mojap suite of package dependancies

on: pull_request

env:
  REPO_NAME: ${{ github.event.repository.name }}
  ORG_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
        fail-fast: true
        matrix:
          python-version: ["3.13", "3.14"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: check changes for conflicts with other mojap package dependencies
        uses: moj-analytical-services/actions-mojap-package-depends@31a6fc22fce972edab0d92e5d53ca45dcbca7aa9
        with:
          org-repo: ${{ env.ORG_REPO }}
          repo: ${{ env.REPO_NAME }}
